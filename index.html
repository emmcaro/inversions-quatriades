
<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Entrenador d'Acords al Piano</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
    @import url('https://fonts.googleapis.com/css2?family=Fredoka+One&display=swap');

    :root {
      --bg-dark: #1C2135;
      --card-bg: #2C344F;
      --primary-text: #FFFFFF;
      --secondary-text: #A9B1D6;
      --accent-pink: #E04463;
      --accent-green: #89d489;
      --accent-blue: #61afef;
      --disabled-bg: #5c678c;
    }

    body {
      font-family: 'Inter', Arial, sans-serif;
      text-align: center;
      margin: 0;
      background-color: var(--bg-dark);
      color: var(--secondary-text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 10px;
      box-sizing: border-box;
      overflow: hidden;
    }

    /* Pantalla d'avís per girar el mòbil */
    #landscape-warning {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background-color: var(--bg-dark);
      color: var(--primary-text);
      z-index: 9999;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 20px;
      box-sizing: border-box;
    }

    #landscape-warning h2 {
      font-family: 'Fredoka One', cursive;
      margin-bottom: 10px;
    }

    #landscape-warning p {
      font-size: 1.1em;
      color: var(--secondary-text);
    }

    #landscape-warning .icona-girar {
      font-size: 4em;
      margin-bottom: 20px;
      animation: girar 2s infinite ease-in-out;
    }

    @keyframes girar {
      0% { transform: rotate(0deg); }
      50% { transform: rotate(-90deg); }
      100% { transform: rotate(-90deg); }
    }

    /* Activar l'avís si estem en vertical en una pantalla petita */
    @media screen and (orientation: portrait) and (max-width: 768px) {
      #landscape-warning { display: flex; }
      .container { display: none !important; }
    }

    .container {
      background-color: var(--card-bg);
      padding: 20px;
      border-radius: 20px;
      width: 100%;
      max-width: 900px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
      display: flex;
      flex-direction: column;
    }
    
    h1 {
      font-size: 1.2em;
      color: var(--primary-text);
      font-weight: 700;
      margin: 0 0 15px 0;
    }

    .top-info {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
      font-size: 0.95em;
    }

    #punts, #temps {
      margin: 0;
      min-width: 65px;
      font-weight: bold;
      color: var(--primary-text);
    }
    
    .selector-dificultat {
        display: flex;
        border: 1px solid var(--disabled-bg);
        border-radius: 8px;
        overflow: hidden;
    }
    .btn-dificultat {
        background-color: transparent;
        color: var(--secondary-text);
        border: none;
        padding: 6px 12px;
        font-size: 0.85em;
        font-weight: 700;
        cursor: pointer;
        transition: background-color 0.2s ease, color 0.2s ease;
    }
    .btn-dificultat.actiu {
        background-color: var(--accent-blue);
        color: var(--primary-text);
    }
    
    #pregunta {
      font-family: 'Fredoka One', cursive;
      font-size: 2.5em;
      color: var(--primary-text);
      margin: 0 0 20px 0;
      min-height: 70px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      line-height: 1.1;
    }

    .inversio-text {
      font-family: 'Inter', sans-serif;
      font-size: 0.35em;
      font-weight: 700;
      color: var(--accent-blue);
      margin-top: 5px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    
    .status-area {
      display: flex;
      justify-content: space-between;
      align-items: center;
      min-height: 25px;
      margin-top: 15px;
    }

    #resultat {
      font-weight: bold;
      font-size: 1.1em;
      margin: 0;
    }

    #resum {
      color: var(--primary-text);
      font-weight: bold;
      margin: 0;
    }
    
    .piano-keyboard {
      display: flex;
      justify-content: center;
      position: relative;
      width: 100%;
      height: 180px;
    }

    .octave {
      width: 50%;
      display: flex;
      position: relative;
    }

    .key {
      border: 1px solid #111;
      cursor: pointer;
      box-sizing: border-box;
      transition: background-color 0.1s ease;
    }
    .key.white {
      width: 14.28%;
      height: 100%;
      background-color: #f9f9f9;
      border-bottom-left-radius: 4px;
      border-bottom-right-radius: 4px;
      box-shadow: inset 0 -10px 10px rgba(0,0,0,0.1);
    }
    .key.black {
      position: absolute;
      width: 9%;
      height: 60%;
      background-color: #222;
      z-index: 2;
      border-bottom-left-radius: 3px;
      border-bottom-right-radius: 3px;
      box-shadow: inset 0 -5px 5px rgba(255,255,255,0.2);
    }

    .key:not(.disabled):hover { background-color: #e0e0e0; }
    .key.black:not(.disabled):hover { background-color: #444; }
    
    .key.selected { background-color: var(--accent-blue) !important; }
    .key.correct { background-color: var(--accent-green) !important; }
    .key.incorrect { background-color: var(--accent-pink) !important; }
    
    .key.disabled { 
        cursor: not-allowed;
        opacity: 0.8;
    }

    audio { display: none; }
  </style>
</head>
<body>

  <div id="landscape-warning">
    <div class="icona-girar">📱</div>
    <h2>Gira el dispositiu</h2>
    <p>Aquesta aplicació necessita la pantalla en format apaisat per mostrar el piano correctament.</p>
  </div>

  <div class="container">
    <div class="top-info">
      <h1 style="margin: 0;">🎹 Entrenador d'Acords</h1>
      <div class="selector-dificultat">
          <button id="btn-facil" class="btn-dificultat">Fàcil</button>
          <button id="btn-dificil" class="btn-dificultat">Difícil</button>
      </div>
    </div>

    <div class="top-info" style="margin-bottom: 10px;">
      <p id="punts">Punts: 0/10</p>
      <p id="temps">Temps: 15s</p>
    </div>

    <div id="pregunta">Carregant...</div>
    
    <div class="piano-keyboard" id="piano">
      <div class="octave">
        <div class="key white" data-index="0"></div>
        <div class="key white" data-index="2"></div>
        <div class="key white" data-index="4"></div>
        <div class="key white" data-index="5"></div>
        <div class="key white" data-index="7"></div>
        <div class="key white" data-index="9"></div>
        <div class="key white" data-index="11"></div>
        <div class="key black" data-index="1" style="left: 9.7%;"></div>
        <div class="key black" data-index="3" style="left: 24%;"></div>
        <div class="key black" data-index="6" style="left: 52.8%;"></div>
        <div class="key black" data-index="8" style="left: 67.1%;"></div>
        <div class="key black" data-index="10" style="left: 81.4%;"></div>
      </div>
      <div class="octave">
        <div class="key white" data-index="12"></div>
        <div class="key white" data-index="14"></div>
        <div class="key white" data-index="16"></div>
        <div class="key white" data-index="17"></div>
        <div class="key white" data-index="19"></div>
        <div class="key white" data-index="21"></div>
        <div class="key white" data-index="23"></div>
        <div class="key black" data-index="13" style="left: 9.7%;"></div>
        <div class="key black" data-index="15" style="left: 24%;"></div>
        <div class="key black" data-index="18" style="left: 52.8%;"></div>
        <div class="key black" data-index="20" style="left: 67.1%;"></div>
        <div class="key black" data-index="22" style="left: 81.4%;"></div>
      </div>
    </div>

    <div class="status-area">
      <p id="resultat"></p>
      <p id="resum"></p>
    </div>
  </div>

  <audio id="soCorrecte" src="correcte.mp3" preload="auto"></audio>
  <audio id="soError" src="error.mp3" preload="auto"></audio>

  <script>
    const arrels = ["Do", "Do#", "Re", "Mib", "Mi", "Fa", "Fa#", "Sol", "Lab", "La", "Sib", "Si"];
    
    const  qualitatsAcords = {
      "Maj7": [0, 4, 7, 11],
      "m7": [0, 3, 7, 10],
      "7": [0, 4, 7, 10],
      "m7b5": [0, 3, 6, 10]
    };

    const inversionsText = ["Estat fonamental", "1a inversió", "2a inversió", "3a inversió"];

    let estatActual = {
      arrelIndex: 0,
      qualitat: "",
      inversio: 0
    };

    let notesSeleccionades = [];
    let punts = 0, totalRespostes = 0;
    let temps = 0, intervalId = null;
    let nivellDificultat = 'facil';
    let respostaJaDonada = false;

    // Elements DOM
    const pianoEl = document.getElementById("piano");
    const preguntaEl = document.getElementById("pregunta");
    const resultatEl = document.getElementById("resultat");
    const puntsEl = document.getElementById("punts");
    const tempsEl = document.getElementById("temps");
    const resumEl = document.getElementById("resum");
    const btnFacil = document.getElementById('btn-facil');
    const btnDificil = document.getElementById('btn-dificil');
    const soCorrecte = document.getElementById("soCorrecte");
    const soError = document.getElementById("soError");
    
    function obtenirTempsMaxim() {
        return nivellDificultat === 'facil' ? 15 : 10;
    }

    function iniciarPartida(dificultat) {
      nivellDificultat = dificultat;
      
      btnFacil.classList.toggle('actiu', nivellDificultat === 'facil');
      btnDificil.classList.toggle('actiu', nivellDificultat === 'dificil');

      punts = 0;
      totalRespostes = 0;
      puntsEl.textContent = `Punts: ${punts}/10`;
      resumEl.textContent = '';
      resultatEl.textContent = '';
      if (intervalId) clearInterval(intervalId);

      nouRepte();
    }

    function nouRepte() {
      if (totalRespostes >= 10) {
        finalitzarPartida();
        return;
      }
      
      resultatEl.textContent = "";
      notesSeleccionades = [];
      document.querySelectorAll('.key').forEach(k => {
          k.classList.remove('correct', 'incorrect', 'selected', 'disabled');
      });

      estatActual.arrelIndex = Math.floor(Math.random() * arrels.length);
      
      const q = Object.keys(qualitatsAcords);
      estatActual.qualitat = q[Math.floor(Math.random() * q.length)];

      if (nivellDificultat === 'facil') {
          estatActual.inversio = 0;
      } else {
          estatActual.inversio = Math.floor(Math.random() * 4);
      }

      preguntaEl.innerHTML = `
        ${arrels[estatActual.arrelIndex]}${estatActual.qualitat}
        <div class="inversio-text">${inversionsText[estatActual.inversio]}</div>
      `;
      
      temps = obtenirTempsMaxim();
      tempsEl.textContent = `Temps: ${temps}s`;
      intervalId = setInterval(actualitzarTemps, 1000);
      respostaJaDonada = false;
    }

    function actualitzarTemps() {
      temps--;
      tempsEl.textContent = `Temps: ${temps}s`;
      if (temps < 0 && !respostaJaDonada) {
        clearInterval(intervalId);
        soError.play().catch(() => {}); 
        resultatEl.textContent = "Temps esgotat!";
        resultatEl.style.color = 'var(--accent-pink)';
        finalitzarTorn();
      }
    }

    function clickPiano(event) {
      const tecla = event.target;
      if (respostaJaDonada || !tecla.classList.contains('key') || tecla.classList.contains('disabled')) {
        return;
      }

      const index = parseInt(tecla.dataset.index);

      if (notesSeleccionades.includes(index)) {
          notesSeleccionades = notesSeleccionades.filter(n => n !== index);
          tecla.classList.remove('selected');
      } else {
          if (notesSeleccionades.length < 4) {
              notesSeleccionades.push(index);
              tecla.classList.add('selected');
          }
      }

      if (notesSeleccionades.length === 4) {
          avaluarResposta();
      }
    }

    function avaluarResposta() {
        respostaJaDonada = true;
        clearInterval(intervalId);

        const seleccionadesOrdenades = [...notesSeleccionades].sort((a, b) => a - b);
        const baixUsuari = seleccionadesOrdenades[0];
        const pitchUsuari = notesSeleccionades.map(n => n % 12).sort((a, b) => a - b);

        const intervals = qualitatsAcords[estatActual.qualitat];
        const intervalBaix = intervals[estatActual.inversio];
        const baixEsperatClass = (estatActual.arrelIndex + intervalBaix) % 12;
        const pitchEsperat = intervals.map(i => (estatActual.arrelIndex + i) % 12).sort((a, b) => a - b);

        let esCorrecte = true;
        if (baixUsuari % 12 !== baixEsperatClass) esCorrecte = false;
        if (JSON.stringify(pitchUsuari) !== JSON.stringify(pitchEsperat)) esCorrecte = false;

        notesSeleccionades.forEach(idx => {
            const teclaEl = document.querySelector(`[data-index="${idx}"]`);
            if(teclaEl) {
                teclaEl.classList.remove('selected');
                teclaEl.classList.add(esCorrecte ? 'correct' : 'incorrect');
            }
        });

        if (esCorrecte) {
            punts++;
            soCorrecte.play().catch(() => {});
            resultatEl.textContent = "Molt bé!";
            resultatEl.style.color = 'var(--accent-green)';
        } else {
            soError.play().catch(() => {});
            resultatEl.textContent = "Incorrecte!";
            resultatEl.style.color = 'var(--accent-pink)';
        }

        finalitzarTorn();
    }
    
    function finalitzarTorn() {
        totalRespostes++;
        puntsEl.textContent = `Punts: ${punts}/10`;
        document.querySelectorAll('.key').forEach(k => k.classList.add('disabled'));
        setTimeout(nouRepte, 2000); 
    }

    function finalitzarPartida() {
      preguntaEl.innerHTML = "🎉";
      resumEl.textContent = `Has fet ${punts} punts!`;
      document.querySelectorAll('.key').forEach(k => k.classList.add('disabled'));
      if(intervalId) clearInterval(intervalId);
      tempsEl.textContent = "Temps: 0s";
      
      setTimeout(() => {
          resultatEl.innerHTML = `<button class="btn-dificultat actiu" style="padding: 10px 20px; font-size:1em; border-radius:8px;" onclick="iniciarPartida(nivellDificultat)">Tornar a jugar</button>`;
      }, 1500);
    }

    btnFacil.addEventListener('click', () => iniciarPartida('facil'));
    btnDificil.addEventListener('click', () => iniciarPartida('dificil'));
    pianoEl.addEventListener("click", clickPiano);

    window.onload = () => {
      iniciarPartida('facil');
    };
  </script>
</body>
</html>

```
